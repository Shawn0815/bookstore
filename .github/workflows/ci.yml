name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: springboot
          MYSQL_DATABASE: bookshop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Load database schema
        run: |
          for f in backend/sql/schema/*.sql; do
            mysql -h127.0.0.1 -P3306 -uroot -pspringboot bookshop < "$f"
          done

      - name: Run backend tests
        working-directory: ./backend
        run: mvn test
